# Default-deny for the namespace, then explicit allows for exactly the
# traffic the stack needs.
#
# K3s DOES enforce NetworkPolicy — it ships a built-in controller
# (kube-router based) and this cluster is installed WITHOUT
# `--disable-network-policy`, so these rules are live.
#
# Canonical idiom notes:
#   * "to any destination on port N" is written as a rule with `ports:`
#     and NO `to:` key. An explicit `to: []` (empty list) is read by
#     kube-router as "match nothing" and silently blocks the traffic —
#     that is what broke pod DNS in an earlier revision.
#   * NodePort traffic is SNAT'd to a node/bridge address by kube-proxy,
#     so ingress for a NodePort service is allowed from anywhere on that
#     port (a `ports:`-only rule).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: world-cup-monitoring
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
# DNS for every pod (CoreDNS lives in kube-system). Without this, every
# other egress rule is useless because names don't resolve.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: world-cup-monitoring
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# world-cup-web: NodePort ingress on 8080 (+ Prometheus scrape), egress
# to HTTPS (raw.githubusercontent.com for the openfootball dataset).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-allow
  namespace: world-cup-monitoring
spec:
  podSelector:
    matchLabels:
      app: world-cup-web
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
  egress:
    - ports:
        - protocol: TCP
          port: 443
---
# Prometheus: scraped by Grafana only; scrapes node-exporter + the web app.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus-allow
  namespace: world-cup-monitoring
spec:
  podSelector:
    matchLabels:
      app: prometheus
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: grafana
      ports:
        - protocol: TCP
          port: 9090
  egress:
    # node-exporter runs hostNetwork, so its traffic uses the node IP and
    # a podSelector peer won't match — allow 9100 to any destination.
    - ports:
        - protocol: TCP
          port: 9100
    - to:
        - podSelector:
            matchLabels:
              app: world-cup-web
      ports:
        - protocol: TCP
          port: 8080
---
# Grafana: NodePort ingress on 3000; reads from Prometheus.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana-allow
  namespace: world-cup-monitoring
spec:
  podSelector:
    matchLabels:
      app: grafana
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - ports:
        - protocol: TCP
          port: 3000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 9090
