# World Cup 2026 Monitor — web app (frontend + live-score API + /metrics)
#
# One consolidated deployment replaces the old separate "app" (nginx
# busy-loop placeholder) and "worldcup-exporter" (runtime `pip install`
# in a shell one-liner) workloads: a single pinned, pre-built image
# keeps the t3.micro's footprint small and removes the supply-chain
# risk of installing packages from PyPI on every pod start.
#
# IMAGE_PLACEHOLDER is substituted by CI with an ECR Public tag pinned
# to the git commit SHA that was actually built and pushed — never
# `:latest`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: world-cup-web
  namespace: world-cup-monitoring
  labels:
    app: world-cup-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: world-cup-web
  template:
    metadata:
      labels:
        app: world-cup-web
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 8080
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              memory: "48Mi"
              cpu: "30m"
            limits:
              memory: "128Mi"
              cpu: "150m"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: world-cup-web-service
  namespace: world-cup-monitoring
  labels:
    app: world-cup-web
spec:
  type: NodePort
  selector:
    app: world-cup-web
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
      protocol: TCP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: world-cup-web-hpa
  namespace: world-cup-monitoring
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: world-cup-web
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
