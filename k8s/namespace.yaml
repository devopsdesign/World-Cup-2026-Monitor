apiVersion: v1
kind: Namespace
metadata:
  name: world-cup-monitoring
  labels:
    name: world-cup-monitoring
    # Pod Security Admission. `enforce: baseline` blocks privileged /
    # hostNetwork / hostPath pods; `warn`/`audit: restricted` surface the
    # stricter checks without blocking. Every workload in this namespace
    # already satisfies `restricted`, so you can raise `enforce` to
    # `restricted` — node-exporter (hostNetwork) lives in kube-system.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
