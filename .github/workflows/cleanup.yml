name: Cleanup Infrastructure (Bulletproof)

# Tears down everything infra/main.tf creates and guarantees a clean
# account afterwards.
#
# The OIDC deploy role is resource-scoped and CANNOT run account-wide
# `list` calls (s3:ListAllMyBuckets, iam:ListRoles, ...). So this
# workflow discovers the exact resource names from Terraform state /
# outputs and operates on them by name — every such call is covered by
# the role's resource-scoped permissions. It never enumerates the
# account.
#
# It is also resilient to a half-destroyed state: `terraform destroy`
# may fail and the run still finishes — the staging bucket is emptied
# first, every post-terraform step is `if: always()`, a name-targeted
# AWS sweep mops up, a final refreshed destroy reconciles state, and a
# verification step is the only thing that decides pass/fail.
#
# NOT touched (account-level, from infra/bootstrap): the Terraform
# state bucket, the lock table, the KMS key, and the
# world-cup-monitor-gha-deploy OIDC role this workflow runs as.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "DELETE_ALL" to confirm cleanup'
        required: true
        type: string
        default: ""
      project_name:
        description: "Project name prefix (leave as default unless you changed it)"
        required: true
        type: string
        default: "world-cup-monitor"

permissions:
  contents: read
  id-token: write

concurrency:
  group: world-cup-monitor-deploy # shares the deploy lock: never nuke mid-apply
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_LOCK_TABLE: ${{ vars.TF_LOCK_TABLE }}
      # Dispatch inputs are consumed through env: only — never
      # interpolated straight into a run: string.
      CONFIRM_INPUT: ${{ github.event.inputs.confirm }}
      PROJECT_TAG: ${{ github.event.inputs.project_name }}
      TF_VAR_project_name: ${{ github.event.inputs.project_name }}
      TF_VAR_tf_state_bucket: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_tf_lock_table: ${{ vars.TF_LOCK_TABLE }}
      TF_VAR_grafana_nodeport_cidr: ${{ vars.GRAFANA_NODEPORT_CIDR }}
      TF_VAR_budget_alert_email: ${{ vars.BUDGET_ALERT_EMAIL }}
      TF_VAR_monthly_budget_usd: ${{ vars.MONTHLY_BUDGET_USD }}

    steps:
      - name: Validate confirmation
        run: |
          NORMALIZED=$(printf '%s' "$CONFIRM_INPUT" | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')
          if [ "$NORMALIZED" != "DELETE_ALL" ]; then
            echo "::error::confirmation must be DELETE_ALL (got '${CONFIRM_INPUT}')"
            exit 1
          fi
          case "$PROJECT_TAG" in
            world-cup-monitor|world-cup-monitor-*) : ;;
            *) echo "::error::refusing to run against an unexpected project prefix '${PROJECT_TAG}'"; exit 1 ;;
          esac
          echo "Confirmed. Tearing down: $PROJECT_TAG"

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS credentials (OIDC — no static keys)
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.9.0"

      # ── Discover exact resource names from Terraform state. These feed
      #    every later step so we never need an account-wide list call.
      - name: Discover resources from Terraform state
        id: discover
        continue-on-error: true
        working-directory: ./infra
        run: |
          set -u
          if ! aws s3api head-bucket --bucket "$TF_STATE_BUCKET" 2>/dev/null; then
            echo "State bucket $TF_STATE_BUCKET is gone — nothing to discover."
            exit 0
          fi
          terraform init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="dynamodb_table=$TF_LOCK_TABLE" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="key=k3s-cluster/terraform.tfstate" \
            -backend-config="encrypt=true"

          # Read from `state show`, not `output` — a partial destroy strips
          # the outputs block ("Warning: No outputs found"), but the
          # resources themselves stay in state until they're really gone.
          SUFFIX=$(terraform state show -no-color random_id.key_suffix 2>/dev/null \
            | sed -n 's/^[[:space:]]*hex[[:space:]]*=[[:space:]]*"\([0-9a-f]\{6,16\}\)".*/\1/p' | head -1)
          MB=$(terraform state show -no-color aws_s3_bucket.manifests 2>/dev/null \
            | sed -n 's/^[[:space:]]*bucket[[:space:]]*=[[:space:]]*"\([a-z0-9.-]\{3,63\}\)".*/\1/p' | head -1)
          [ -z "$MB" ] && [ -n "$SUFFIX" ] && MB="${PROJECT_TAG}-manifests-${SUFFIX}"

          # Strict validation — never let stray text reach $GITHUB_ENV.
          case "$MB" in ""|*[!a-z0-9.-]*) MB="" ;; esac
          case "$SUFFIX" in ""|*[!a-f0-9]*) SUFFIX="" ;; esac

          printf 'manifest_bucket=%s\n' "$MB" >> "$GITHUB_ENV"
          printf 'name_suffix=%s\n'     "$SUFFIX" >> "$GITHUB_ENV"
          echo "discovered → bucket='${MB:-<none>}' suffix='${SUFFIX:-<none>}'"
          echo "── current state:"; terraform state list 2>/dev/null || true

      # ── Empty the staging bucket by its known name (resource-scoped
      #    perms cover this) so `terraform destroy` can remove it.
      - name: Empty the manifest staging bucket
        if: always() && env.manifest_bucket != ''
        continue-on-error: true
        run: |
          set -u
          B="$manifest_bucket"
          echo "emptying s3://$B"
          aws s3 rm "s3://$B" --recursive || true
          VERSIONS=$(aws s3api list-object-versions --bucket "$B" \
            --query '{Objects: [].{Key:Key,VersionId:VersionId}}' --output json 2>/dev/null || echo '{"Objects":null}')
          COUNT=$(printf '%s' "$VERSIONS" | python3 -c 'import sys,json;print(len(json.load(sys.stdin).get("Objects") or []))' 2>/dev/null || echo 0)
          [ "$COUNT" != "0" ] && aws s3api delete-objects --bucket "$B" --delete "$VERSIONS" || true

      - name: Terraform destroy
        id: tf_destroy
        continue-on-error: true
        working-directory: ./infra
        run: |
          set -u
          if ! aws s3api head-bucket --bucket "$TF_STATE_BUCKET" 2>/dev/null; then
            echo "No state bucket — skipping Terraform, the sweep will finish up."
            exit 0
          fi
          [ -d .terraform ] || terraform init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="dynamodb_table=$TF_LOCK_TABLE" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="key=k3s-cluster/terraform.tfstate" \
            -backend-config="encrypt=true"

          for attempt in 1 2 3; do
            echo "::group::terraform destroy (attempt $attempt/3)"
            if terraform destroy -auto-approve -input=false -refresh=true; then
              echo "::endgroup::"; exit 0
            fi
            echo "::endgroup::"
            echo "attempt $attempt failed; re-emptying the bucket and retrying in 20s"
            [ -n "${manifest_bucket:-}" ] && aws s3 rm "s3://$manifest_bucket" --recursive || true
            sleep 20
          done
          echo "::warning::terraform destroy did not converge — the name-targeted sweep will finish the job"
          exit 1

      # ── Name-targeted AWS sweep. Runs regardless of Terraform's result.
      - name: Sweep leftover AWS resources by name
        if: always()
        continue-on-error: true
        run: |
          set -u
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

          # EC2 + SG discovery by tag is fine — ec2:Describe* is allowed.
          IIDS=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${PROJECT_TAG}-*" \
              "Name=instance-state-name,Values=pending,running,stopping,stopped" \
            --query 'Reservations[].Instances[].InstanceId' --output text)
          if [ -n "$IIDS" ]; then
            echo "terminating instances: $IIDS"
            aws ec2 terminate-instances --instance-ids $IIDS >/dev/null || true
            aws ec2 wait instance-terminated --instance-ids $IIDS || true
          fi
          for sg in $(aws ec2 describe-security-groups \
            --filters "Name=tag:Name,Values=${PROJECT_TAG}-*" \
            --query 'SecurityGroups[].GroupId' --output text); do
            echo "deleting security group $sg"; aws ec2 delete-security-group --group-id "$sg" || true
          done

          # Everything else is addressed BY NAME (no account-wide list).
          if [ -n "${name_suffix:-}" ]; then
            ROLE="${PROJECT_TAG}-node-role-${name_suffix}"
            PROFILE="${PROJECT_TAG}-node-profile-${name_suffix}"
            if aws iam get-instance-profile --instance-profile-name "$PROFILE" >/dev/null 2>&1; then
              aws iam remove-role-from-instance-profile --instance-profile-name "$PROFILE" --role-name "$ROLE" || true
              echo "deleting instance profile $PROFILE"
              aws iam delete-instance-profile --instance-profile-name "$PROFILE" || true
            fi
            if aws iam get-role --role-name "$ROLE" >/dev/null 2>&1; then
              for p in $(aws iam list-attached-role-policies --role-name "$ROLE" --query 'AttachedPolicies[].PolicyArn' --output text); do
                aws iam detach-role-policy --role-name "$ROLE" --policy-arn "$p" || true
              done
              for p in $(aws iam list-role-policies --role-name "$ROLE" --query 'PolicyNames[]' --output text); do
                aws iam delete-role-policy --role-name "$ROLE" --policy-name "$p" || true
              done
              echo "deleting role $ROLE"
              aws iam delete-role --role-name "$ROLE" || true
            fi
          fi

          if [ -n "${manifest_bucket:-}" ]; then
            aws s3 rm "s3://$manifest_bucket" --recursive || true
            echo "deleting bucket $manifest_bucket"
            aws s3api delete-bucket --bucket "$manifest_bucket" || true
          fi

          aws budgets delete-budget --account-id "$ACCOUNT_ID" \
            --budget-name "${PROJECT_TAG}-free-tier-guard" 2>/dev/null || true

      - name: Reconcile Terraform state
        if: always()
        continue-on-error: true
        working-directory: ./infra
        run: |
          set -u
          aws s3api head-bucket --bucket "$TF_STATE_BUCKET" 2>/dev/null || { echo "no state bucket; nothing to reconcile"; exit 0; }
          [ -d .terraform ] || terraform init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="dynamodb_table=$TF_LOCK_TABLE" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="key=k3s-cluster/terraform.tfstate" \
            -backend-config="encrypt=true"
          terraform destroy -auto-approve -input=false -refresh=true || true
          echo "── remaining in state:"; terraform state list || true

      # ── Source of truth. Checks only by name / tag; fails if anything remains.
      - name: Verify the account is clean
        if: always()
        run: |
          set -u
          REMAIN=""

          I=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${PROJECT_TAG}-*" \
              "Name=instance-state-name,Values=pending,running,stopping,stopped" \
            --query 'Reservations[].Instances[].InstanceId' --output text)
          [ -n "$I" ] && REMAIN="${REMAIN} instances=[$I]"

          S=$(aws ec2 describe-security-groups \
            --filters "Name=tag:Name,Values=${PROJECT_TAG}-*" \
            --query 'SecurityGroups[].GroupId' --output text)
          [ -n "$S" ] && REMAIN="${REMAIN} security-groups=[$S]"

          if [ -n "${manifest_bucket:-}" ] && aws s3api head-bucket --bucket "$manifest_bucket" 2>/dev/null; then
            REMAIN="${REMAIN} bucket=[$manifest_bucket]"
          fi

          if [ -n "${name_suffix:-}" ] && aws iam get-role \
            --role-name "${PROJECT_TAG}-node-role-${name_suffix}" >/dev/null 2>&1; then
            REMAIN="${REMAIN} node-role=[${PROJECT_TAG}-node-role-${name_suffix}]"
          fi

          # Backstop: any AWS resource still in Terraform state means the
          # destroy did not finish, even if the name-checks above missed it.
          if aws s3api head-bucket --bucket "$TF_STATE_BUCKET" 2>/dev/null; then
            LEFT=$(cd infra \
              && terraform init -input=false -reconfigure \
                   -backend-config="bucket=$TF_STATE_BUCKET" \
                   -backend-config="dynamodb_table=$TF_LOCK_TABLE" \
                   -backend-config="region=$AWS_REGION" \
                   -backend-config="key=k3s-cluster/terraform.tfstate" \
                   -backend-config="encrypt=true" >/dev/null 2>&1 \
              && terraform state list 2>/dev/null | grep '^aws_' || true)
            [ -n "$LEFT" ] && REMAIN="${REMAIN} tf-state=[$(echo "$LEFT" | tr '\n' ' ')]"
          fi

          if [ -n "$REMAIN" ]; then
            echo "::error::project resources still present:${REMAIN}"
            exit 1
          fi
          {
            echo "## Cleanup verified — account is clean"
            echo "No \`${PROJECT_TAG}-*\` instance, security group, staging bucket or node role remains."
            echo ""
            echo "Preserved by design (infra/bootstrap): state bucket \`${TF_STATE_BUCKET}\`, lock table \`${TF_LOCK_TABLE}\`, OIDC deploy role."
          } >> "$GITHUB_STEP_SUMMARY"
