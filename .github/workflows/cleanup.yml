name: Cleanup Infrastructure (Bulletproof)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "DELETE_ALL" to confirm cleanup'
        required: true
        type: string
        default: ''
      project_name:
        description: 'Project Name Tag (e.g., world-cup-monitor)'
        required: true
        type: string
        default: 'world-cup-monitor'
      delete_s3_bucket:
        description: 'Delete Terraform state S3 bucket name (Wipes everything)'
        required: true
        type: string
        default: 'tf-state-world-cup-monitor'

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      PROJECT_TAG: ${{ github.event.inputs.project_name }}
      S3_BUCKET: ${{ github.event.inputs.delete_s3_bucket }}

    steps:
      - name: Validate Confirmation
        run: |
          echo "🔒 Validating cleanup confirmation..."
          NORMALIZED=$(echo "${{ github.event.inputs.confirm }}" | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')
          if [ "$NORMALIZED" != "DELETE_ALL" ]; then
            echo "❌ ERROR: Confirmation must be 'DELETE_ALL'."
            exit 1
          fi
          echo "✅ Confirmation received. Purging all AWS assets for: $PROJECT_TAG"

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform Destroy
        id: tf-destroy
        working-directory: ./infra
        run: |
          echo "🔍 Checking if S3 backend bucket exists..."
          if aws s3api head-bucket --bucket "$S3_BUCKET" 2>/dev/null; then
            echo "🚀 Initializing Terraform with remote backend..."
            terraform init -backend-config="bucket=$S3_BUCKET"
            
            echo "💥 Running Terraform Destroy..."
            terraform destroy -auto-approve -var="project_name=$PROJECT_TAG"
          else
            echo "ℹ️ S3 State Bucket not found. Skipping native Terraform destroy and switching entirely to the Janitor fallback script."
          fi

      - name: 🔍 Scan & Nuke Orphaned Resources
        run: |
          echo "🔍 Scanning for remaining resources tagged '$PROJECT_TAG'..."

          # Stop and terminate instances
          INSTANCE_IDS=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=*$PROJECT_TAG*" "Name=instance-state-name,Values=running,pending,stopped" \
            --query 'Reservations[*].Instances[*].InstanceId' --output text)
          if [ -n "$INSTANCE_IDS" ]; then
            echo "🛑 Force terminating instances: $INSTANCE_IDS"
            aws ec2 terminate-instances --instance-ids $INSTANCE_IDS
            aws ec2 wait instance-terminated --instance-ids $INSTANCE_IDS
          fi

          # Delete Volumes
          VOLUME_IDS=$(aws ec2 describe-volumes \
            --filters "Name=tag:Name,Values=*$PROJECT_TAG*" \
            --query 'Volumes[*].VolumeId' --output text)
          for vol in $VOLUME_IDS; do
            echo "💾 Deleting volume: $vol"
            aws ec2 delete-volume --volume-id $vol || true
          done

          # Delete Security Groups
          SG_IDS=$(aws ec2 describe-security-groups \
            --filters "Name=tag:Name,Values=*$PROJECT_TAG*" \
            --query 'SecurityGroups[*].GroupId' --output text)
          for sg in $SG_IDS; do
            echo "🛡️ Deleting Security Group: $sg"
            aws ec2 delete-security-group --group-id $sg || true
          done

      - name: 🗑️ Empty & Nuke S3 State Bucket
        run: |
          echo "🗑️ Stripping S3 Bucket: $S3_BUCKET"
          
          if aws s3api head-bucket --bucket "$S3_BUCKET" 2>/dev/null; then
            echo "🔄 Emptying object versions and delete markers..."
            aws s3api delete-objects --bucket "$S3_BUCKET" \
              --delete "$(aws s3api list-object-versions --bucket "$S3_BUCKET" --query '{Objects: Versions[].{Key: Key, VersionId: VersionId}}' --output json)" 2>/dev/null || true
            
            aws s3api delete-objects --bucket "$S3_BUCKET" \
              --delete "$(aws s3api list-object-versions --bucket "$S3_BUCKET" --query '{Objects: DeleteMarkers[].{Key: Key, VersionId: VersionId}}' --output json)" 2>/dev/null || true

            echo "💥 Removing Bucket..."
            aws s3 rb s3://$S3_BUCKET --force
            echo "✅ S3 Bucket fully deleted."
          else
            echo "ℹ️ Bucket $S3_BUCKET does not exist or was already removed."
          fi

      - name: 📊 Final Summary
        run: |
          echo "=========================================="
          echo "       BULLETPROOF CLEANUP COMPLETE"
          echo "=========================================="
          echo " All tracked and untracked AWS resources under target '$PROJECT_TAG' have been destroyed."
          echo " Free tier standing preserved."
          echo "=========================================="