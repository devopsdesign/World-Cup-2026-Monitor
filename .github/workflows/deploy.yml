name: Deploy K3s + Monitoring Stack (Hardened)

# Required one-time setup (see README "Deploying" section):
#   Repo Variables (Settings -> Actions -> Variables):
#     AWS_REGION, AWS_ROLE_ARN, TF_STATE_BUCKET, TF_LOCK_TABLE,
#     GRAFANA_NODEPORT_CIDR, BUDGET_ALERT_EMAIL, MONTHLY_BUDGET_USD,
#     ECR_PUBLIC_ALIAS
#   Environment Secret (Settings -> Environments -> production):
#     GRAFANA_ADMIN_PASSWORD
#   Environment "production" should have required reviewers configured
#   so `apply`/`destroy` runs need a human approval.
#
# There is no AWS access key/secret anywhere in this file — auth is
# short-lived GitHub OIDC -> AWS IAM role (see infra/bootstrap/main.tf).
# There is no SSH key and no direct Kubernetes API access: all
# in-cluster work happens via AWS SSM Run Command running `k3s kubectl`
# locally on the node. The k3s API listens on 6443 but the security
# group opens no 6443 ingress, so it is unreachable from the internet.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action"
        required: true
        default: "apply"
        type: choice
        options: ["apply", "destroy"]

permissions:
  contents: read
  id-token: write

concurrency:
  group: world-cup-monitor-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_LOCK_TABLE: ${{ vars.TF_LOCK_TABLE }}
  IMAGE_NAME: public.ecr.aws/${{ vars.ECR_PUBLIC_ALIAS }}/worldcup-web

jobs:
  determine-action:
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.pick.outputs.action }}
    steps:
      - name: Pick action
        id: pick
        env:
          DISPATCH_ACTION: ${{ github.event.inputs.action }}
        run: |
          echo "action=${DISPATCH_ACTION:-apply}" >> "$GITHUB_OUTPUT"

  test:
    needs: determine-action
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run unit tests
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install --disable-pip-version-check -r src/app/requirements.txt pytest
          pytest -q

  build:
    needs: [determine-action, test]
    if: needs.determine-action.outputs.action == 'apply'
    runs-on: ubuntu-latest
    # No `environment: production` here — the image push has no infra
    # side effects, and gating both build and deploy on the protected
    # environment would prompt for approval twice per run. The approval
    # gate lives on `deploy` only.
    permissions:
      contents: read
      id-token: write
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Compute image tag
        id: tag
        run: echo "image_tag=${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC — no static keys)
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR Public
        run: |
          aws ecr-public get-login-password --region us-east-1 |
            docker login --username AWS --password-stdin public.ecr.aws

      - name: Set up Buildx
        uses: docker/setup-buildx-action@988b5a0280414f521da01fcc63a27aeeb4b104db # v3.6.1

      - name: Build and push worldcup-web
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./src/app
          push: true
          tags: ${{ steps.tag.outputs.image_tag }}

  deploy:
    needs: [determine-action, test, build]
    if: always() && !failure() && !cancelled()
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      TF_ACTION: ${{ needs.determine-action.outputs.action }}
      TF_VAR_project_name: world-cup-monitor
      TF_VAR_tf_state_bucket: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_tf_lock_table: ${{ vars.TF_LOCK_TABLE }}
      TF_VAR_grafana_nodeport_cidr: ${{ vars.GRAFANA_NODEPORT_CIDR }}
      TF_VAR_budget_alert_email: ${{ vars.BUDGET_ALERT_EMAIL }}
      TF_VAR_monthly_budget_usd: ${{ vars.MONTHLY_BUDGET_USD }}
      IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS credentials (OIDC — no static keys)
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.9.0"

      - name: Terraform Init
        working-directory: ./infra
        run: |
          terraform init \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="dynamodb_table=$TF_LOCK_TABLE" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="key=k3s-cluster/terraform.tfstate" \
            -backend-config="encrypt=true"

      - name: Terraform Apply
        if: env.TF_ACTION == 'apply'
        working-directory: ./infra
        run: terraform apply -auto-approve

      - name: Terraform Destroy
        if: env.TF_ACTION == 'destroy'
        working-directory: ./infra
        run: terraform destroy -auto-approve

      - name: Read Terraform outputs
        if: env.TF_ACTION == 'apply'
        id: tf
        working-directory: ./infra
        run: |
          echo "instance_id=$(terraform output -raw ec2_instance_id)" >> "$GITHUB_OUTPUT"
          echo "public_ip=$(terraform output -raw ec2_public_ip)" >> "$GITHUB_OUTPUT"
          echo "manifest_bucket=$(terraform output -raw manifest_bucket)" >> "$GITHUB_OUTPUT"

      - name: Wait for SSM agent to come online
        if: env.TF_ACTION == 'apply'
        env:
          INSTANCE_ID: ${{ steps.tf.outputs.instance_id }}
        run: |
          echo "Waiting for SSM agent on $INSTANCE_ID..."
          for i in $(seq 1 60); do
            STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
              --query 'InstanceInformationList[0].PingStatus' --output text 2>/dev/null || echo "")
            if [ "$STATUS" = "Online" ]; then
              echo "SSM agent online."
              exit 0
            fi
            echo "Attempt $i/60: SSM status='$STATUS'. Waiting 10s..."
            sleep 10
          done
          echo "SSM agent never came online." >&2
          exit 1

      - name: Setup kubectl (client only — no cluster access from the runner)
        if: env.TF_ACTION == 'apply'
        uses: azure/setup-kubectl@3e0aec4d80787158d308d7b364cb1b702e7feb7f # v4.0.0

      - name: Render manifests
        if: env.TF_ACTION == 'apply'
        env:
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        run: |
          rm -rf rendered
          cp -r k8s rendered

          sed -i "s|IMAGE_PLACEHOLDER|${IMAGE_TAG}|g" rendered/apps/web-deployment.yaml

          # Dashboards + the import script travel to the node with the
          # manifests, so Grafana is provisioned over loopback and never
          # has to be reachable from this runner or the internet.
          cp scripts/import-dashboards.sh rendered/
          cp -r docs/dashboards rendered/dashboards

          # Generated at deploy time from the GitHub Actions secret — this
          # file is never committed to git and never printed.
          kubectl create secret generic grafana-admin-credentials \
            --namespace world-cup-monitoring \
            --from-literal=admin-user=admin \
            --from-literal=admin-password="$GRAFANA_ADMIN_PASSWORD" \
            --dry-run=client -o yaml > rendered/monitoring/grafana-secret.yaml

      - name: Stage manifests to S3
        if: env.TF_ACTION == 'apply'
        env:
          MANIFEST_BUCKET: ${{ steps.tf.outputs.manifest_bucket }}
        run: aws s3 sync ./rendered "s3://$MANIFEST_BUCKET/k8s" --delete

      - name: Apply manifests via SSM (no direct Kubernetes API access)
        if: env.TF_ACTION == 'apply'
        env:
          INSTANCE_ID: ${{ steps.tf.outputs.instance_id }}
          MANIFEST_BUCKET: ${{ steps.tf.outputs.manifest_bucket }}
        run: |
          SCRIPT=$(cat <<'EOS'
          set -e
          NS=world-cup-monitoring
          cloud-init status --wait || true
          export DEBIAN_FRONTEND=noninteractive
          MISSING=""
          command -v aws >/dev/null 2>&1 || MISSING="$MISSING awscli"
          command -v jq  >/dev/null 2>&1 || MISSING="$MISSING jq"
          if [ -n "$MISSING" ]; then
            apt-get update
            apt-get install -y $MISSING
          fi

          # Wait for k3s itself to be serving before touching it.
          for i in $(seq 1 60); do
            k3s kubectl get --raw='/readyz' >/dev/null 2>&1 && break
            echo "waiting for k3s API ($i/60)"; sleep 5
          done

          # Refuse to deploy onto a cluster whose DNS is down; try to heal
          # it once (a k3s restart clears most CoreDNS/flannel bootstrap
          # races) before giving up.
          for attempt in 1 2; do
            if k3s kubectl -n kube-system rollout status deploy/coredns --timeout=120s; then break; fi
            if [ "$attempt" = 1 ]; then
              echo "::warning::CoreDNS not ready — restarting k3s"
              systemctl restart k3s
              sleep 20
            else
              echo "::error::CoreDNS still not ready after a k3s restart"
              k3s kubectl -n kube-system get pods -o wide || true
              k3s kubectl -n kube-system logs -l k8s-app=kube-dns --tail=30 || true
              exit 1
            fi
          done

          aws s3 sync "s3://__BUCKET__/k8s" /tmp/k8s --delete

          dump() {
            echo "==================== DIAGNOSTICS ===================="
            echo "--- free -m ---";            free -m || true
            echo "--- nodes ---";              k3s kubectl get nodes -o wide || true
            echo "--- pods ---";               k3s kubectl -n "$NS" get pods -o wide || true
            for p in $(k3s kubectl -n "$NS" get pods -o name 2>/dev/null); do
              echo "--- describe $p ---";      k3s kubectl -n "$NS" describe "$p" | tail -40 || true
              echo "--- logs $p ---";          k3s kubectl -n "$NS" logs "$p" --all-containers --tail=60 || true
              echo "--- logs $p (previous) ---"; k3s kubectl -n "$NS" logs "$p" --all-containers --previous --tail=40 2>/dev/null || true
            done
            echo "--- events ---";             k3s kubectl -n "$NS" get events --sort-by=.lastTimestamp | tail -40 || true
            echo "===================================================="
          }
          roll() {  # roll <deployment> <timeout-seconds>
            echo ">>> rollout: $1 (timeout ${2}s)"
            if ! k3s kubectl -n "$NS" rollout status "deployment/$1" --timeout="${2}s"; then
              echo "::error::deployment/$1 did not become available in ${2}s"
              dump
              exit 1
            fi
          }

          k3s kubectl apply -f /tmp/k8s/namespace.yaml
          # Retired Prometheus RBAC is cluster-scoped: `apply` in a namespace dir won't prune it.
          k3s kubectl delete clusterrole prometheus-cluster-role --ignore-not-found
          k3s kubectl delete clusterrolebinding prometheus-cluster-role-binding --ignore-not-found

          # Warm the app image before its rollout wait, so that wait isn't
          # racing containerd's parallel-pull queue (grafana/prometheus are
          # ~hundreds of MB on a cold node). Non-fatal — the Deployment
          # retries the pull anyway.
          APP_IMG=$(grep -m1 -E '^\s*image:' /tmp/k8s/apps/web-deployment.yaml | awk '{print $2}')
          [ -n "$APP_IMG" ] && (k3s ctr images pull "$APP_IMG" || echo "pre-pull of $APP_IMG failed, continuing")

          k3s kubectl apply -R -f /tmp/k8s/monitoring -f /tmp/k8s/apps

          roll world-cup-web 420
          roll prometheus 300
          roll grafana 300

          chmod +x /tmp/k8s/import-dashboards.sh
          /tmp/k8s/import-dashboards.sh || echo "::warning::dashboard import failed (app + monitoring are up)"

          echo "--- final state ---"
          k3s kubectl -n "$NS" get pods -o wide
          k3s kubectl -n kube-system get pods -l k8s-app=kube-dns -o wide || true
          echo "--- node /etc/resolv.conf ---"; cat /etc/resolv.conf || true
          echo "--- world-cup-web logs (tail) ---"
          k3s kubectl -n "$NS" logs deployment/world-cup-web --tail=40 || true
          echo "--- upstream reachability from the node ---"
          curl -sS -m 15 -o /dev/null -w 'node  https %{http_code} in %{time_total}s\n' \
            https://raw.githubusercontent.com/openfootball/worldcup.json/master/2026/worldcup.json || echo "node cannot reach openfootball"
          echo "--- in-pod DNS + HTTPS ---"
          POD=$(k3s kubectl -n "$NS" get pod -l app=world-cup-web -o jsonpath='{.items[0].metadata.name}')
          k3s kubectl -n "$NS" exec "$POD" -- python -c "import socket;print('resolve raw.githubusercontent.com ->', socket.gethostbyname('raw.githubusercontent.com'))" 2>&1 || true
          k3s kubectl -n "$NS" exec "$POD" -- python -c "import httpx;r=httpx.get('https://raw.githubusercontent.com/openfootball/worldcup.json/master/2026/worldcup.json',timeout=15);print('in-pod https', r.status_code, len(r.content))" 2>&1 || true
          EOS
          )
          SCRIPT="${SCRIPT//__BUCKET__/$MANIFEST_BUCKET}"

          PAYLOAD=$(jq -n --arg s "$SCRIPT" '{commands: [$s]}')
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "world-cup-monitor deploy $GITHUB_SHA" \
            --timeout-seconds 1800 \
            --parameters "$PAYLOAD" \
            --query 'Command.CommandId' --output text)

          echo "SSM command: $CMD_ID"
          for i in $(seq 1 140); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query 'Status' --output text 2>/dev/null || echo "Pending")
            echo "Attempt $i/140: status=$STATUS"
            if [ "$STATUS" = "Success" ]; then
              aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
                --query 'StandardOutputContent' --output text
              exit 0
            fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "--- stdout ---"
              aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
                --query 'StandardOutputContent' --output text
              echo "--- stderr ---"
              aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
                --query 'StandardErrorContent' --output text
              exit 1
            fi
            sleep 15
          done
          echo "SSM command did not finish in time." >&2
          exit 1

      # Grafana dashboards are imported inside the SSM Run Command step
      # above (over the node's loopback interface), so there is no
      # internet-facing Grafana call from this runner.

      - name: Deployment summary
        if: success() && env.TF_ACTION == 'apply'
        env:
          PUBLIC_IP: ${{ steps.tf.outputs.public_ip }}
          INSTANCE_ID: ${{ steps.tf.outputs.instance_id }}
        run: |
          {
            echo "## World Cup 2026 Monitor - Deployment Summary"
            echo "Status: deployment succeeded."
            echo ""
            echo "| Service | URL | Credentials |"
            echo "| :-- | :-- | :-- |"
            echo "| App (frontend + API + /metrics) | http://$PUBLIC_IP:30080 | none (public) |"
            echo "| Grafana | http://$PUBLIC_IP:30030 | admin / value of the GRAFANA_ADMIN_PASSWORD secret |"
            echo "| Prometheus | not internet-exposed | reach it via an SSM port-forward tunnel |"
            echo ""
            echo "No SSH key and no public Kubernetes API exist for this deployment."
            echo "For shell/kubectl access, use AWS SSM Session Manager against instance $INSTANCE_ID."
          } >> "$GITHUB_STEP_SUMMARY"
